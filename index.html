<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Ôn GRE Verbal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23284a8a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='600' text-anchor='middle' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-nav="today" aria-label="Về trang Hôm nay">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span class="brand-text">Sổ GRE Verbal</span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Điều hướng chính"></nav>
      <div class="topbar-right">
        <button class="edit-toggle" id="editToggle" data-act="ce-toggle" aria-pressed="false" hidden title="Bật/tắt Chế độ sửa nội dung">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 20h4L19 9l-4-4L4 16v4Zm9-13 4 4"/></svg><span class="tab-long">Chế độ sửa</span><span class="tab-short">Sửa</span>
        </button>
        <span class="sync" id="sync" role="status" aria-live="polite">
          <span class="sync-dot" aria-hidden="true"></span><span class="sync-text">Đã lưu</span>
        </span>
        <div class="me">
          <button class="me-btn" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Tài khoản và cài đặt">
            <span class="me-initial" id="meInitial" aria-hidden="true">?</span>
          </button>
          <div class="me-menu" id="meMenu" role="menu" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"><div class="loading">Đang tải…</div></main>

  <div class="sheet-backdrop" id="settingsBackdrop" hidden></div>
  <aside class="settings" id="settings" hidden aria-label="Cài đặt"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:16px">Web cần bật JavaScript.</p></noscript>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
