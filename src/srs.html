<script>
/**
 * Srs.js: lõi logic dùng chung cho server (Apps Script), client (nhúng qua srs.html do build sinh ra)
 * và test Node (require). Không phụ thuộc API của Apps Script hay trình duyệt.
 *
 * Gồm: hộp Leitner, sổ từ hay quên, phiên ôn hôm nay, sinh phương án nhiễu,
 * ánh xạ phương án GRE về id từ, render ví dụ an toàn.
 */
var Srs = (function () {
  'use strict';

  var INTERVALS = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30 };
  var MASTERED_REPEAT = 60; // hộp 5 trả lời đúng: giữ hộp 5, hẹn 60 ngày
  var MAX_BOX = 5;
  var VN_OFFSET_MS = 7 * 3600 * 1000; // Asia/Ho_Chi_Minh, không có giờ mùa hè
  var CUSTOM_CLUSTER_ID = 'custom';

  var PRAISE_GROUPS = ['lukewarm', 'excess', 'flattery'];
  var CRITICISM_GROUPS = ['belittle', 'reprove', 'denounce', 'ridicule', 'quibble'];

  /* ---------------- Ngày giờ ---------------- */

  function vnDate(ms) {
    return new Date(ms + VN_OFFSET_MS).toISOString().slice(0, 10);
  }

  function addDays(dateStr, n) {
    var p = dateStr.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function daysBetween(a, b) {
    var pa = a.split('-'), pb = b.split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  }

  function isDateStr(s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  /* ---------------- Trạng thái từ ---------------- */

  function newState(wordId) {
    return {
      wordId: wordId, box: 0, dueDate: '', lapses: 0, correctStreak: 0, totalReviews: 0,
      lastResult: '', lastReviewed: '', confusedWith: [], updatedAt: '', lastMoved: ''
    };
  }

  function normalizeState(raw) {
    var s = newState(String(raw.wordId || ''));
    s.box = clampInt(raw.box, 0, MAX_BOX);
    s.dueDate = isDateStr(raw.dueDate) ? raw.dueDate : '';
    s.lapses = clampInt(raw.lapses, 0, 9999);
    s.correctStreak = clampInt(raw.correctStreak, 0, 9999);
    s.totalReviews = clampInt(raw.totalReviews, 0, 999999);
    s.lastResult = ['again', 'hard', 'good'].indexOf(raw.lastResult) >= 0 ? raw.lastResult : '';
    s.lastReviewed = raw.lastReviewed ? String(raw.lastReviewed) : '';
    var cw = raw.confusedWith;
    if (typeof cw === 'string') cw = cw ? cw.split(/[,;\s]+/) : [];
    s.confusedWith = (cw || []).filter(Boolean).map(String).slice(0, 5);
    s.updatedAt = raw.updatedAt ? String(raw.updatedAt) : '';
    s.lastMoved = isDateStr(raw.lastMoved) ? raw.lastMoved : '';
    return s;
  }

  function clampInt(v, lo, hi) {
    var n = parseInt(v, 10);
    if (isNaN(n)) n = lo;
    return Math.max(lo, Math.min(hi, n));
  }

  function clone(s) {
    var c = {};
    for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) c[k] = s[k];
    c.confusedWith = (s.confusedWith || []).slice();
    return c;
  }

  /**
   * Cập nhật trạng thái sau một câu trả lời.
   * result: 'again' (Chưa nhớ / sai), 'hard' (Tạm), 'good' (Thuộc / đúng).
   *
   * - Mỗi từ chỉ đổi hộp (lên hoặc xuống) tối đa một lần mỗi ngày tính từ lần đổi đầu (lastMoved).
   *   Một từ vừa bị đánh rớt hôm nay, nếu sau đó trả lời đúng trong cùng ngày, vẫn ở hộp 1 và hẹn ngày mai.
   * - Lần gặp đầu tiên (hộp 0) mà sai không tính là "quên" (lapse), vì chưa từng thuộc.
   */
  function applyResult(state, result, today, nowIso) {
    var s = clone(state);
    var prevBox = s.box || 0;
    s.totalReviews += 1;
    s.lastResult = result;
    s.lastReviewed = nowIso;
    s.updatedAt = nowIso;

    if (result === 'again') {
      if (prevBox >= 1) s.lapses += 1;
      s.box = 1;
      s.correctStreak = 0;
      s.dueDate = today;
      s.lastMoved = today;
    } else if (result === 'hard') {
      if (s.box < 1) { s.box = 1; s.lastMoved = today; }
      s.dueDate = addDays(today, 1);
    } else if (result === 'good') {
      if (prevBox >= 1 && s.lastMoved === today) {
        // đã đổi hộp hôm nay: chỉ ghi nhận lượt ôn; nếu đang đến hạn thì dời sang mai
        if (!s.dueDate || s.dueDate <= today) s.dueDate = addDays(today, 1);
      } else {
        if (prevBox >= MAX_BOX) {
          s.box = MAX_BOX;
          s.dueDate = addDays(today, MASTERED_REPEAT);
        } else {
          s.box = prevBox + 1;
          s.dueDate = addDays(today, INTERVALS[s.box]);
        }
        s.correctStreak += 1;
        s.lastMoved = today;
      }
    } else {
      throw new Error('Kết quả không hợp lệ: ' + result);
    }
    return s;
  }

  /** Chỉ ghi nhận một lượt gặp (các targets không phải đáp án trong bài GRE). */
  function touchReview(state, nowIso) {
    var s = clone(state);
    s.totalReviews += 1;
    s.updatedAt = nowIso;
    return s;
  }

  function addConfusion(state, otherId, nowIso) {
    var s = clone(state);
    if (!otherId || otherId === s.wordId) return s;
    s.confusedWith = [otherId].concat(s.confusedWith.filter(function (x) { return x !== otherId; })).slice(0, 5);
    s.updatedAt = nowIso;
    return s;
  }

  /** Sổ từ hay quên: vào khi lapses ≥ 2, hoặc vừa quên (again) và lapses ≥ 1; rời khi correctStreak ≥ 3.
   *  correctStreak chỉ tăng khi lên hộp, tối đa một lần mỗi ngày, nên streak 3 luôn trải trên ≥ 3 ngày. */
  function isLeech(s) {
    if (!s) return false;
    if (s.correctStreak >= 3) return false;
    return s.lapses >= 2 || (s.lastResult === 'again' && s.lapses >= 1);
  }

  function isDue(s, today) {
    return !!s && s.box >= 1 && !!s.dueDate && s.dueDate <= today;
  }

  /** Trạng thái hiển thị: new (chưa học), learning (đang học), known (đã thuộc), leech (hay quên). */
  function statusOf(s) {
    if (!s || s.box === 0) return 'new';
    if (isLeech(s)) return 'leech';
    return s.box >= 4 ? 'known' : 'learning';
  }

  /** Gộp hai bản trạng thái: bản có updatedAt mới hơn thắng. */
  function newer(a, b) {
    if (!a) return b;
    if (!b) return a;
    return String(b.updatedAt || '') > String(a.updatedAt || '') ? b : a;
  }

  /* ---------------- Chỉ mục dữ liệu ---------------- */

  function lc(s) { return String(s || '').toLowerCase().trim(); }

  function wordForms(w) {
    var forms = [];
    String(w.word || '').split('/').forEach(function (alt) {
      var f = lc(alt);
      if (!f) return;
      forms.push(f);
      var first = f.split(/\s+/)[0];
      if (first !== f) forms.push(first);
    });
    forms.push(lc(w.id));
    return forms.filter(function (f, i) { return forms.indexOf(f) === i; });
  }

  function groupDirection(group) {
    if (!group) return '';
    if (group.direction) return group.direction;
    var id = group.id;
    if (/^praise-/.test(id) || PRAISE_GROUPS.indexOf(id) >= 0) return 'praise';
    if (CRITICISM_GROUPS.indexOf(id) >= 0) return 'criticism';
    return '';
  }

  /**
   * Dựng chỉ mục từ VOCAB_DATA ({clusters:[...]}) và danh sách từ tự thêm.
   */
  function buildIndex(vocab, customWords) {
    var clusters = (vocab.clusters || []).slice().sort(function (a, b) { return a.order - b.order; });
    var custom = {
      id: CUSTOM_CLUSTER_ID, title: 'Từ tự thêm', order: 9999, custom: true,
      description: 'Các từ bạn tự thêm.',
      groups: [{ id: 'custom', title: 'Từ tự thêm', scale: false, note: '' }],
      words: (customWords || []).map(function (w) {
        var c = {};
        for (var k in w) c[k] = w[k];
        c.group = 'custom';
        c.confusables = c.confusables || [];
        c.collocations = c.collocations || [];
        c.custom = true;
        return c;
      }),
      exercises: []
    };
    var all = clusters.concat([custom]);
    var idx = { clusters: all, clusterById: {}, words: [], byId: {}, groupById: {}, exercises: [], exById: {}, formMap: {}, reverseConf: {} };
    all.forEach(function (c) {
      idx.clusterById[c.id] = c;
      (c.groups || []).forEach(function (g) {
        idx.groupById[g.id] = { id: g.id, title: g.title, scale: !!g.scale, note: g.note || '', clusterId: c.id, direction: groupDirection(g) };
      });
      (c.words || []).forEach(function (w, i) {
        var e = {};
        for (var k in w) e[k] = w[k];
        e.clusterId = c.id;
        e.clusterOrder = c.custom ? -1 : c.order; // từ tự thêm được ưu tiên giới thiệu trước
        e.fileIndex = i;
        e.confusables = e.confusables || [];
        e.collocations = e.collocations || [];
        e.forms = wordForms(e);
        idx.words.push(e);
        idx.byId[e.id] = e;
      });
      (c.exercises || []).forEach(function (ex) {
        var e = {};
        for (var k in ex) e[k] = ex[k];
        e.clusterId = c.id;
        idx.exercises.push(e);
        idx.exById[e.id] = e;
      });
    });
    idx.words.forEach(function (w) {
      w.forms.forEach(function (f) {
        (idx.formMap[f] = idx.formMap[f] || []).push(w.id);
      });
      w.confusables.forEach(function (cid) {
        (idx.reverseConf[cid] = idx.reverseConf[cid] || []).push(w.id);
      });
    });
    idx.exercises.forEach(function (ex) {
      ex.answerIds = exerciseAnswerIds(ex, idx);
    });
    return idx;
  }

  /* ---------------- Ánh xạ phương án GRE về id ---------------- */

  function stemCandidates(w) {
    var out = [w];
    function add(x) { if (x && x.length >= 3 && out.indexOf(x) < 0) out.push(x); }
    var m;
    if ((m = w.match(/^(.*)ied$/))) add(m[1] + 'y');
    if ((m = w.match(/^(.*)ing$/))) {
      add(m[1]); add(m[1] + 'e');
      if (/(.)\1$/.test(m[1])) add(m[1].slice(0, -1));
    }
    if ((m = w.match(/^(.*)ed$/))) {
      add(m[1]); add(m[1] + 'e');
      if (/(.)\1$/.test(m[1])) add(m[1].slice(0, -1));
    }
    if ((m = w.match(/^(.*)d$/))) add(m[1]);
    if ((m = w.match(/^(.*)ies$/))) add(m[1] + 'y');
    if ((m = w.match(/^(.*)es$/))) add(m[1]);
    if ((m = w.match(/^(.*)s$/))) add(m[1]);
    return out;
  }

  /**
   * Ánh xạ một phương án (vd "lauded", "scoffed at", "self-deprecating", "a backhanded compliment") về id từ.
   * Ưu tiên id nằm trong targets của bài. Không khớp được thì trả về null.
   */
  function mapOptionToId(option, idx, targets) {
    var base = lc(option).replace(/^(a|an|the)\s+/, '').replace(/^self-/, '');
    if (!base) return null;
    var tokens = base.split(/\s+/);
    var tries = [];
    stemCandidates(tokens[0]).forEach(function (st) {
      if (tokens.length > 1) tries.push([st].concat(tokens.slice(1)).join(' '));
    });
    stemCandidates(base).forEach(function (st) { tries.push(st); });
    if (tokens.length > 1) stemCandidates(tokens[0]).forEach(function (st) { tries.push(st); });
    targets = targets || [];
    for (var i = 0; i < tries.length; i++) {
      var ids = idx.formMap[tries[i]];
      if (!ids || !ids.length) continue;
      for (var j = 0; j < ids.length; j++) if (targets.indexOf(ids[j]) >= 0) return ids[j];
      return ids[0];
    }
    return null;
  }

  function exerciseAnswerIds(ex, idx) {
    var answers = ex.type === 'se' ? ex.answers : (ex.blanks || []).map(function (b) { return b.answer; });
    var ids = [];
    answers.forEach(function (a) {
      var id = mapOptionToId(a, idx, ex.targets);
      if (id && ids.indexOf(id) < 0) ids.push(id);
    });
    return ids;
  }

  /**
   * Chấm bài GRE. choice: TC -> mảng chuỗi theo từng chỗ trống; SE -> mảng 2 chuỗi đã chọn.
   * Trả về {correct, answerIds, otherTargetIds, confusions: [{wordId, confusedWith}]}.
   */
  function gradeExercise(ex, choice, idx) {
    var correct, confusions = [];
    function pushConf(rightOpt, wrongOpt) {
      var r = mapOptionToId(rightOpt, idx, ex.targets);
      var w = mapOptionToId(wrongOpt, idx, ex.targets);
      if (r && w && r !== w) confusions.push({ wordId: r, confusedWith: w });
    }
    if (ex.type === 'se') {
      var chosen = choice || [];
      correct = chosen.length === 2 && ex.answers.every(function (a) { return chosen.indexOf(a) >= 0; });
      if (!correct) {
        var missed = ex.answers.filter(function (a) { return chosen.indexOf(a) < 0; });
        var wrong = chosen.filter(function (c) { return ex.answers.indexOf(c) < 0; });
        missed.forEach(function (m) { wrong.forEach(function (w) { pushConf(m, w); }); });
      }
    } else {
      correct = ex.blanks.every(function (b, i) { return choice && choice[i] === b.answer; });
      ex.blanks.forEach(function (b, i) {
        if (choice && choice[i] && choice[i] !== b.answer) pushConf(b.answer, choice[i]);
      });
    }
    var answerIds = ex.answerIds || exerciseAnswerIds(ex, idx);
    var otherTargetIds = (ex.targets || []).filter(function (t) { return answerIds.indexOf(t) < 0 && idx.byId[t]; });
    return { correct: correct, answerIds: answerIds, otherTargetIds: otherTargetIds, confusions: confusions };
  }

  /** Bài GRE cho một từ: ưu tiên bài mà từ là đáp án, rồi bài có từ trong targets; trong mỗi loại chọn bài làm ít gần đây nhất. */
  function pickExerciseForWord(wordId, idx, exLast) {
    exLast = exLast || {};
    function byOldest(a, b) {
      var ta = exLast[a.id] || '', tb = exLast[b.id] || '';
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    }
    var asAnswer = idx.exercises.filter(function (e) { return e.answerIds.indexOf(wordId) >= 0; }).sort(byOldest);
    if (asAnswer.length) return asAnswer[0];
    var asTarget = idx.exercises.filter(function (e) { return (e.targets || []).indexOf(wordId) >= 0; }).sort(byOldest);
    return asTarget[0] || null;
  }

  /* ---------------- Phương án nhiễu (Nghĩa → Từ) ---------------- */

  function normMeaning(s) { return lc(s).replace(/[.,;:!?()]/g, '').replace(/\s+/g, ' '); }

  function sameFamily(a, b) {
    var fa = a.forms, fb = b.forms;
    for (var i = 0; i < fa.length; i++) {
      for (var j = 0; j < fb.length; j++) {
        var x = fa[i], y = fb[j];
        if (x.length < 4 || y.length < 4) continue;
        var short = x.length <= y.length ? x : y, long = x.length <= y.length ? y : x;
        if (long.indexOf(short) === 0) return true;               // laud / laudable
        if (short.length >= 6 && long.indexOf(short) >= 0) return true; // qualified / unqualified
        var k = 0;
        while (k < x.length && k < y.length && x[k] === y[k]) k++;
        if (k >= 6) return true;
      }
    }
    return false;
  }

  function posSet(p) { return lc(p).split('/').map(function (x) { return x.trim(); }); }
  function posCompatible(a, b) {
    var sa = posSet(a.pos), sb = posSet(b.pos);
    return sa.some(function (x) { return sb.indexOf(x) >= 0; });
  }

  function shuffle(arr, rng) {
    rng = rng || Math.random;
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /**
   * Chọn n phương án nhiễu cho bài Nghĩa → Từ, theo thứ tự:
   *  1. confusables của từ đúng (rồi các từ coi từ đúng là confusable)
   *  2. cùng nhóm, level gần nhất
   *  3. cùng cụm, cùng hướng nghĩa (nếu không rõ hướng: cùng cụm)
   *  4. phần còn lại (cùng hướng trước)
   * Trong các bậc 2–4, từ cùng loại từ được ưu tiên.
   * Loại trừ: nghĩa giống hệt từ đúng; cùng dòng từ (trừ khi dữ liệu ghi rõ là confusable).
   */
  function pickDistractors(word, idx, n, rng) {
    n = n || 3;
    rng = rng || Math.random;
    var out = [];
    var used = {};
    used[word.id] = true;
    var wm = normMeaning(word.meaning);
    var wGroup = idx.groupById[word.group];
    var wDir = groupDirection(wGroup);

    function accept(c, allowFamily) {
      if (!c || used[c.id] || out.length >= n) return;
      if (normMeaning(c.meaning) === wm) return;
      if (!allowFamily && sameFamily(word, c)) return;
      used[c.id] = true;
      out.push(c.id);
    }

    function tier(cands, keyFn) {
      var list = shuffle(cands, rng).map(function (c, i) { return { c: c, i: i }; });
      list.sort(function (a, b) {
        var ka = keyFn(a.c), kb = keyFn(b.c);
        for (var t = 0; t < ka.length; t++) if (ka[t] !== kb[t]) return ka[t] - kb[t];
        return a.i - b.i;
      });
      list.forEach(function (x) { accept(x.c, false); });
    }

    var posKey = function (c) { return posCompatible(word, c) ? 0 : 1; };

    // 1. confusables
    word.confusables.forEach(function (id) { accept(idx.byId[id], true); });
    (idx.reverseConf[word.id] || []).forEach(function (id) { accept(idx.byId[id], true); });

    // 2. cùng nhóm, level gần nhất
    var sameGroup = idx.words.filter(function (c) { return c.group === word.group && c.id !== word.id; });
    tier(sameGroup, function (c) {
      var d = (word.level && c.level) ? Math.abs(word.level - c.level) : 9;
      return [d, posKey(c)];
    });

    // 3. cùng cụm, cùng hướng (không rõ hướng: cùng cụm)
    var sameCluster = idx.words.filter(function (c) {
      if (c.clusterId !== word.clusterId || c.id === word.id) return false;
      if (!wDir) return true;
      return groupDirection(idx.groupById[c.group]) === wDir;
    });
    tier(sameCluster, function (c) { return [posKey(c)]; });

    // 4. phần còn lại: cùng hướng trước, rồi cùng cụm, rồi cùng loại từ
    var rest = idx.words.filter(function (c) { return c.id !== word.id; });
    tier(rest, function (c) {
      var dir = groupDirection(idx.groupById[c.group]);
      return [wDir && dir === wDir ? 0 : 1, c.clusterId === word.clusterId ? 0 : 1, posKey(c)];
    });

    // Bất đắc dĩ: nới điều kiện cùng dòng từ
    if (out.length < n) idx.words.forEach(function (c) { accept(c, true); });
    return out;
  }

  /* ---------------- Phiên ôn hôm nay ---------------- */

  function newWordOrder(a, b) {
    if (a.clusterOrder !== b.clusterOrder) return a.clusterOrder - b.clusterOrder;
    if ((b.priority || 0) !== (a.priority || 0)) return (b.priority || 0) - (a.priority || 0);
    return a.fileIndex - b.fileIndex;
  }

  /**
   * Danh sách thẻ hôm nay: từ đến hạn (sổ hay quên trước, hộp thấp trước) + từ mới.
   * opts: {today, newLimit, newDoneToday, max}
   * Trả về {items: [{wordId, isNew}], total, dueCount, newCount}.
   */
  function buildDailyQueue(idx, states, opts) {
    var today = opts.today;
    var max = opts.max || 40;
    var due = idx.words.filter(function (w) { return isDue(states[w.id], today); });
    due.sort(function (a, b) {
      var sa = states[a.id], sb = states[b.id];
      var la = isLeech(sa) ? 0 : 1, lb = isLeech(sb) ? 0 : 1;
      if (la !== lb) return la - lb;
      if (sa.box !== sb.box) return sa.box - sb.box;
      if (sa.dueDate !== sb.dueDate) return sa.dueDate < sb.dueDate ? -1 : 1;
      return (b.priority || 0) - (a.priority || 0);
    });
    var room = Math.max(0, (opts.newLimit || 0) - (opts.newDoneToday || 0));
    var fresh = idx.words.filter(function (w) { var s = states[w.id]; return !s || !s.box; })
      .sort(newWordOrder).slice(0, room);
    var items = due.map(function (w) { return { wordId: w.id, isNew: false }; })
      .concat(fresh.map(function (w) { return { wordId: w.id, isNew: true }; }));
    return { items: items.slice(0, max), total: items.length, dueCount: due.length, newCount: fresh.length };
  }

  /** Các từ chưa học theo thứ tự giới thiệu (dùng cho "Học thêm từ mới"). */
  function unlearnedWords(idx, states) {
